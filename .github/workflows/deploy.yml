name: Banking Application CI/CD
 
on:
  push:
    branches:
      - develop
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
 
  workflow_dispatch:
 
permissions:
  contents: read
 
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: banking-devops-dev-app
  ECS_CLUSTER: banking-devops-dev-cluster
  ECS_SERVICE: banking-devops-dev-service
  ECS_TASK_DEFINITION_FAMILY: banking-devops-dev
  CONTAINER_NAME: banking-app
 
jobs:
  build-scan-deploy:
    name: Build, Scan and Deploy
    runs-on: ubuntu-latest
 
    defaults:
      run:
        shell: bash
 
    steps:
      #########################################################
      # Checkout source code
      #########################################################
 
      - name: Checkout source code
        uses: actions/checkout@v4
 
      #########################################################
      # Configure Python
      #########################################################
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements.txt
 
      - name: Install Python dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit
 
      #########################################################
      # Security scan – Bandit
      #########################################################
 
      - name: Run Bandit security scan
        working-directory: app
        run: |
          bandit -r . \
            --exclude ./tests \
            --skip B104 \
            --severity-level medium \
            --confidence-level medium
 
      #########################################################
      # Configure AWS credentials
      #########################################################
 
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
 
      #########################################################
      # Login to Amazon ECR
      #########################################################
 
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
 
      #########################################################
      # Generate image details
      #########################################################
 
      - name: Generate image tags
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          LATEST_IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
 
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "latest_image_uri=${LATEST_IMAGE_URI}" >> "$GITHUB_OUTPUT"
 
          echo "Image URI: ${IMAGE_URI}"
 
      #########################################################
      # Build Docker image
      #########################################################
 
      - name: Build Docker image
        working-directory: app
        run: |
          docker build \
            --tag "${{ steps.image.outputs.image_uri }}" \
            --tag "${{ steps.image.outputs.latest_image_uri }}" \
            .
 
      #########################################################
      # Trivy container image scan
      #########################################################
 
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image_uri }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
 
      #########################################################
      # Push image to ECR
      #########################################################
 
      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.image.outputs.image_uri }}"
          docker push "${{ steps.image.outputs.latest_image_uri }}"
 
      #########################################################
      # Download current ECS task definition
      #########################################################
 
      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${ECS_TASK_DEFINITION_FAMILY}" \
            --query taskDefinition > task-definition.json
 
      #########################################################
      # Remove ECS-generated fields
      #########################################################
 
      - name: Clean ECS task definition
        run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-definition.json > task-definition-clean.json
 
      #########################################################
      # Update container image in task definition
      #########################################################
 
      - name: Render new ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-clean.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image_uri }}
 
      #########################################################
      # Deploy updated task definition
      #########################################################
 
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
 
      #########################################################
      # Deployment validation
      #########################################################
 
      - name: Verify ECS service
        run: |
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query 'services[0].{
              Service:serviceName,
              Status:status,
              Desired:desiredCount,
              Running:runningCount,
              Pending:pendingCount,
              TaskDefinition:taskDefinition
            }' \
            --output table
 
      - name: Deployment summary
        run: |
          {
            echo "## Deployment completed"
            echo ""
            echo "- Environment: dev"
            echo "- Region: ${AWS_REGION}"
            echo "- ECS cluster: ${ECS_CLUSTER}"
            echo "- ECS service: ${ECS_SERVICE}"
            echo "- ECR repository: ${ECR_REPOSITORY}"
            echo "- Image tag: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
       
          echo Add other actions to build,
          echo test, and deploy your project.
