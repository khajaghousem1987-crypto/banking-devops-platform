groups:
- name: banking-slo
  rules:
  - alert: BankingHighErrorRate
    expr: sum(rate(banking_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(banking_http_requests_total[5m])),0.001) > 0.001
    for: 5m
    labels: {severity: critical}
  - alert: BankingP99LatencyHigh
    expr: histogram_quantile(0.99,sum(rate(banking_http_request_duration_seconds_bucket[5m])) by (le)) > 0.2
    for: 5m
    labels: {severity: warning}
